server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ai-recruitment-platform.centralindia.cloudapp.azure.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name ai-recruitment-platform.centralindia.cloudapp.azure.com;

    ssl_certificate /etc/letsencrypt/live/ai-recruitment-platform.centralindia.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-recruitment-platform.centralindia.cloudapp.azure.com/privkey.pem;

    # Fix mixed content: rewrite any http:// redirects from backend to https://
    proxy_redirect http://ai-recruitment-platform.centralindia.cloudapp.azure.com https://ai-recruitment-platform.centralindia.cloudapp.azure.com;

    # ── Next.js static assets (always frontend) ──
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Pure backend API paths (never frontend pages) ──
    location ~ ^/(auth|api|uploads|docs|openapi\.json|pipelines|search|global-search|matching|notification-settings|collaboration|messaging|automation|notifications|portal/positions|portal/parse-resume-fast|portal/candidate|offers/[0-9]+/preview|offers/[0-9]+/download|offers/template) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Hybrid paths (page loads → Next.js, API calls → Backend) ──
    location ~ ^/(analytics|dashboard|copilot|users|candidates|positions|offers|interviews|semantic-search|pipeline)/ {
        if ($http_accept ~* "text/html") {
            proxy_pass http://127.0.0.1:3000;
        }
        if ($args ~* "_rsc=") {
            proxy_pass http://127.0.0.1:3000;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Mailbox backend sub-paths ──
    location ~ ^/mailbox/(connect|disconnect|accounts|oauth|attachments|sync-history|sync|stats|send|messages) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Admin settings public endpoint (always backend) ──
    location = /admin/settings/public {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Admin hybrid paths (page loads → Next.js, API calls → Backend) ──
    location ~ ^/admin/(settings|ai-settings|security|integrations|dashboard|analytics|audit|gdpr|notifications|automation|system-health|overview|stats|sync|logs|users) {
        if ($http_accept ~* "text/html") {
            proxy_pass http://127.0.0.1:3000;
        }
        if ($args ~* "_rsc=") {
            proxy_pass http://127.0.0.1:3000;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Default: smart routing ──
    location / {
        if ($args ~* "_rsc=") {
            proxy_pass http://127.0.0.1:3000;
        }
        if ($http_accept ~* "text/html") {
            proxy_pass http://127.0.0.1:3000;
        }
        if ($request_method != GET) {
            proxy_pass http://127.0.0.1:8000;
        }
        if ($http_authorization != "") {
            proxy_pass http://127.0.0.1:8000;
        }
        if ($http_accept ~* "application/json") {
            proxy_pass http://127.0.0.1:8000;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
